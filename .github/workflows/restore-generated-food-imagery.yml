name: Restore generated food imagery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore binary assets and clean bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          for image in forno27-margherita.png forno27-smash-bacon.png forno27-spread.png; do
            target="public/images/$image"
            : > "$target"
            while IFS= read -r chunk; do
              base64 --decode "$chunk" >> "$target"
            done < <(find ".github/reassembly/$image" -type f -name "*.b64" -print | sort)
          done
          rm -rf .github/reassembly
          rm -f .github/workflows/restore-generated-food-imagery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: restore generated food imagery"
          git push
